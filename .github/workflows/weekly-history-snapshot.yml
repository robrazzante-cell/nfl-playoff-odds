name: Save weekly odds history snapshot

on:
  schedule:
    # Tuesday 10:00 UTC — after Monday Night Football wraps up, so the just-
    # finished week counts as "fully complete" when the backfill script runs.
    - cron: '0 10 * * 2'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Refresh schedule/scores first
        run: node scripts/fetch-data.mjs

      - name: Add this week's odds snapshot (skips weeks already saved)
        run: npm run backfill-history

      - name: Commit changes if anything updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes, nothing to commit."
          else
            git commit -m "Save weekly odds history snapshot [automated]"
            git push
          fi
